name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows runs the real-desktop backend tests; Linux checks that the
        # core and tooling work without Windows-only dependencies.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3 # publishes no floating major tags
        with:
          python-version: "3.13"
          enable-cache: true

      # PySide6's QtGui / QtWidgets load these even offscreen; the Ubuntu
      # runner doesn't ship them (libdbus: QtDBus, for the KDE backend).
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: uv sync --locked

      - name: Black, mypy, pylint, pytest
        run: uv run python scripts/check.py

      - name: CLI smoke test
        if: runner.os == 'Windows'
        run: uv run wallpaper list --all
